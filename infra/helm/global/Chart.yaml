apiVersion: v2
name: virtplc-global
description: A Helm chart for VirtPLC global components (frontend, AI service, monitoring)

type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: prometheus
    version: "25.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "8.0.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: loki
    version: "6.0.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: promtail
    version: "6.15.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: promtail.enabled