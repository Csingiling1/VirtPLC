{{- if .Values.aiService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "virtplc-global.fullname" . }}-ai-service
  labels:
    {{- include "virtplc-global.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
spec:
  type: {{ .Values.aiService.service.type }}
  ports:
    - port: {{ .Values.aiService.service.port }}
      targetPort: {{ .Values.aiService.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "virtplc-global.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
{{- end }}