apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "virtplc-factory.fullname" . }}-test-connection"
  labels:
    {{- include "virtplc-factory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:  ['{{ include "virtplc-factory.fullname" . }}-backend:{{ .Values.backend.service.port }}/actuator/health']
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 128Mi