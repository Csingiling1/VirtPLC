apiVersion: v1
kind: Service
metadata:
  name: {{ include "virtplc-factory.fullname" . }}-backend
  labels:
    {{- include "virtplc-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "virtplc-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend