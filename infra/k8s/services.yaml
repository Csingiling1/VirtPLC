# Global services configuration
apiVersion: v1
kind: Service
metadata:
  name: virtplc-global-frontend
  namespace: virtplc-system
  labels:
    app.kubernetes.io/name: virtplc
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: virtplc-global
    app.kubernetes.io/component: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: virtplc-global-ai-service
  namespace: virtplc-system
  labels:
    app.kubernetes.io/name: virtplc
    app.kubernetes.io/component: ai-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: virtplc-global
    app.kubernetes.io/component: ai-service

---
# Redis service
apiVersion: v1
kind: Service
metadata:
  name: virtplc-redis
  namespace: virtplc-system
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app.kubernetes.io/name: redis

---
# PostgreSQL global service
apiVersion: v1
kind: Service
metadata:
  name: virtplc-global-postgresql
  namespace: virtplc-system
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: global
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: global

---
# Monitoring services
apiVersion: v1
kind: Service
metadata:
  name: virtplc-global-prometheus-server
  namespace: virtplc-monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: prometheus-server

---
apiVersion: v1
kind: Service
metadata:
  name: virtplc-global-grafana
  namespace: virtplc-monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: grafana

---
apiVersion: v1
kind: Service
metadata:
  name: virtplc-global-loki
  namespace: virtplc-monitoring
  labels:
    app.kubernetes.io/name: loki
spec:
  type: ClusterIP
  ports:
  - port: 3100
    targetPort: 3100
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: loki