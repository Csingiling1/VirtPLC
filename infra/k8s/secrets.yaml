# Global secrets for VirtPLC system
apiVersion: v1
kind: Secret
metadata:
  name: virtplc-global-secrets
  namespace: virtplc-system
type: Opaque
data:
  # Database credentials
  postgres-password: dmlydGxkYi1nbG9iYWw=  # virtplc-global (base64 encoded)
  redis-password: dmlydGxkYi1yZWRpcw==    # virtplc-redis (base64 encoded)

  # JWT secrets
  jwt-secret: c2VjcmV0LWp3dC1rZXktZm9yLXZpcnRwbGM=  # secret-jwt-key-for-virtplc (base64 encoded)

  # API keys (placeholders - should be updated with real values)
  openai-api-key: cGxhY2Vob2xkZXItZm9yLW9wZW5haS1rZXk=  # placeholder-for-openai-key (base64 encoded)
  anthropic-api-key: cGxhY2Vob2xkZXItZm9yLWFudGhyb3BpYy1rZXk=  # placeholder-for-anthropic-key (base64 encoded)

---
# Docker registry secret (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: virtplc-registry-secret
  namespace: virtplc-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K  # {} - placeholder, update with real registry credentials

---
# TLS certificate secret (managed by cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: virtplc-tls
  namespace: virtplc-system
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # Placeholder certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t   # Placeholder private key

---
# Monitoring secrets
apiVersion: v1
kind: Secret
metadata:
  name: virtplc-monitoring-secrets
  namespace: virtplc-monitoring
type: Opaque
data:
  grafana-admin-password: YWRtaW4=  # admin (base64 encoded)
  grafana-secret-key: c2VjcmV0LWdyYWZhbmEta2V5  # secret-grafana-key (base64 encoded)