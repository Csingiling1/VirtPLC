# Development Profile - Single Machine Deployment (All services except Node-RED)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  backend:
    environment:
      - PROFILE=dev
      - DATA_SOURCE=simulator
    profiles:
      - dev

  simulator:
    profiles:
      - dev

  simulator-monitor:
    profiles:
      - dev

  frontend:
    environment:
      - PROFILE=dev
    profiles:
      - dev

  ollama:
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - dev

  ollama-init:
    environment:
      - OLLAMA_MODEL=qwen2.5:7b
    profiles:
      - dev

  ai-service:
    environment:
      - PROFILE=dev
      - OLLAMA_MODEL=qwen2.5:7b
    profiles:
      - dev

  postgres:
    profiles:
      - dev

  redis:
    profiles:
      - dev

  timescale:
    profiles:
      - dev

  ignition-edge:
    profiles:
      - dev

  mqtt:
    profiles:
      - dev

  collector:
    profiles:
      - dev

  db-mcp-server:
    profiles:
      - dev

  # Node-RED explicitly excluded in dev profile
