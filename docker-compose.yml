services:
  # Spring Boot Backend with OPC-UA Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtplc-backend
    ports:
      - "18080:8080"   # REST API
      - "14840:4840"   # OPC-UA Server
      - "8000:8000"   # MCP Server
      - "9091:9090"   # gRPC Server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - OPCUA_SERVER_ENABLED=false
      - OPCUA_SERVER_NAMESPACE=http://virtplc.simulator
      - OPCUA_CLIENT_ENABLED=false
      - OPCUA_CLIENT_ENDPOINT=opc.tcp://simulator:4840/virtplc/
      - OPCUA_CLIENT_REQUEST_TIMEOUT=5000
      - OPCUA_CLIENT_SESSION_TIMEOUT=60000
      - SIMULATOR_API_URL=http://simulator:8080
      - SIMULATOR_WS_URL=ws://simulator:8080/ws/data
      - SIMULATOR_BASE_URL=http://simulator:8080
      - DATA_SOURCE=simulator
      - SIMULATOR_NAME=VirtPLC Simulator
      - SPRING_DATASOURCE_URL=jdbc:postgresql://timescale:5432/virtplc_ts
      - SPRING_DATASOURCE_USERNAME=virtplc
      - SPRING_DATASOURCE_PASSWORD=changeme
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - MCP_ENABLED=true
      - MCP_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Enhanced PLC Simulator (Python) - PLC Replacement Server
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: virtplc-simulator
    ports:
      - "24840:4840"   # OPC-UA Server
      - "5000:8080"    # REST API & WebSocket
    environment:
      - PYTHONUNBUFFERED=1
      - SIMULATOR_MODE=plc-server
      - SIMULATOR_HOST=0.0.0.0
      - SIMULATOR_PORT=8080
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - UPDATE_INTERVAL=1.0
    volumes:
      - simulator-data:/app/data
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/simulation/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simulator.rule=Host(`simulator.localhost`)"
      - "traefik.http.services.simulator.loadbalancer.server.port=8080"

  # Simulator Monitoring Dashboard
  simulator-monitor:
    image: nginx:alpine
    container_name: virtplc-simulator-monitor
    ports:
      - "5002:80"
    volumes:
      - ./simulator/monitor.html:/usr/share/nginx/html/index.html
    depends_on:
      - simulator
    networks:
      - virtplc-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_WS_URL=ws://localhost:3002
                - VITE_AI_API_URL=http://localhost:3001
        - VITE_API_BASE_URL=http://localhost:18080
    container_name: virtplc-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      - backend
      - ai-service
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: virtplc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Remove GPU section above if you don't have NVIDIA GPU

  # AI Analysis Service (Python + FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: virtplc-ai
    ports:
      - "3001:3001"   # REST API
      - "3002:3002"   # WebSocket
      - "9090:9090"   # Prometheus metrics
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=DEBUG
      - PORT=3001
      - WS_PORT=3002
      - BACKEND_API_URL=http://backend:8080
      - MCP_ENABLED=true
      - MCP_SERVER_URL=http://db-mcp-server:9092/sse
      - OLLAMA_HOST=http://ollama:11434
      # - OLLAMA_MODEL=llama3:8b
      - OLLAMA_MODEL=qwen2:0.5b
      - TIMESCALE_HOST=timescale
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=virtplc_ts
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=changeme
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANALYSIS_INTERVAL=5000
    volumes:
      - ./ai-service:/app
    depends_on:
      ollama:
        condition: service_started
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      timescale:
        condition: service_healthy
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PostgreSQL (Relational Data)
  postgres:
    image: postgres:16-alpine
    container_name: virtplc-postgres
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_DB=virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ai-service/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtplc -d virtplc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Caching & Sessions)
  redis:
    image: redis:7-alpine
    container_name: virtplc-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # TimescaleDB (Time Series Database)
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: virtplc-timescale
    ports:
      - "15433:5432"  # Use port 15433 to avoid conflict with postgres
    environment:
      - POSTGRES_DB=virtplc_ts
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./backend/init-timescale.sql:/docker-entrypoint-initdb.d/01-timescale-init.sql
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtplc -d virtplc_ts"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Ignition Gateway (HMI) - Integrated
  ignition-edge:
    build:
      context: ./HMI
      dockerfile: Dockerfile
    image: virtplc/ignition-edge:latest
    container_name: virtplc-ignition-edge
    hostname: ignition-edge
    ports:
      - "8088:8088"   # HTTP
      - "8043:8043"   # HTTPS
      - "8060:8060"   # Gateway Network
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./HMI/IgnitionEdge/projects:/usr/local/bin/ignition/data/projects:ro
      - ./HMI/IgnitionEdge/config/gateway.xml:/usr/local/bin/ignition/data/gateway.xml:ro
      - ./HMI/IgnitionEdge/tags:/usr/local/bin/ignition/data/tags:ro
    environment:
      - GATEWAY_ADMIN_USERNAME=${GATEWAY_ADMIN_USERNAME:-admin}
      - GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD:-password}
      - IGNITION_EDITION=edge
      - JAVA_OPTS=-Xmx1g -Xms512m
      - REDIS_HOST=redis
    depends_on:
      - redis
      - simulator
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: virtplc-mqtt
    ports:
      - "1883:1883"  # MQTT port
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
    networks:
      - virtplc-network
    restart: unless-stopped

  # Node-RED MQTT to OPC-UA Bridge
  nodered:
    image: nodered/node-red:latest
    container_name: virtplc-nodered
    ports:
      - "1880:1880"   # Node-RED UI
      - "34840:4840"  # OPC-UA Server
    volumes:
      - nodered-data:/data
      - ./nodered:/data/flows:ro
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-your-secret-key}
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  collector:
    build: ./collector
    container_name: collector
    depends_on:
      - mqtt
      - timescale
    environment:
      - TIMESCALE_HOST=timescale
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=changeme
      - TIMESCALE_DB=virtplc_ts
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    ports:
      - "9100:9100"  # prometheus metrics
    networks:
      - virtplc-network
    restart: on-failure

  # Database MCP Server for AI access to TimescaleDB
  db-mcp-server:
    image: freepeak/db-mcp-server:latest
    container_name: virtplc-db-mcp-server
    ports:
      - "9092:9092"
    volumes:
      - ./db-mcp-config.json:/app/config.json:ro
    environment:
      - MCP_SERVER_PORT=9092
      - MCP_SERVER_CONFIG=/app/config.json
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  virtplc-network:
    driver: bridge
    name: virtplc-network

volumes:
  ollama-data:
    name: virtplc-ollama-data
  postgres-data:
    name: virtplc-postgres-data
  redis-data:
    name: virtplc-redis-data
  timescale-data:
    name: virtplc-timescale-data
  simulator-data:
    name: virtplc-simulator-data
  ignition-data:
    name: virtplc-ignition-data
  nodered-data:
    name: virtplc-nodered-data
