# Base docker-compose.yml - Common service definitions
# Use with profile-specific overlays:
#   Dev (single machine):     docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Stage2 (2 computers):     docker-compose -f docker-compose.yml -f docker-compose.stage2.yml up
#   Production (3 servers):   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # Nginx Reverse Proxy with Rate Limiting
  nginx:
    image: nginx:alpine
    container_name: virtplc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
      - ai-service
    networks:
      - main_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtplc-backend
    expose:
      - "8080"   # REST API (internal only, accessed via nginx)
    ports:
      - "18080:8080"   # Direct access for debugging (optional, can be removed in production)
      - "8000:8000"   # MCP Server
      - "9091:9090"   # gRPC Server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SIMULATOR_API_URL=http://simulator:8080
      - SIMULATOR_WS_URL=ws://simulator:8080/ws/data
      - SIMULATOR_BASE_URL=http://simulator:8080
      - DATA_SOURCE=simulator
      - SIMULATOR_NAME=VirtPLC Simulator
      - SPRING_DATASOURCE_URL=jdbc:postgresql://timescale:5432/virtplc_ts
      - SPRING_DATASOURCE_USERNAME=virtplc
      - SPRING_DATASOURCE_PASSWORD=changeme
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CACHE_TYPE=redis
      - MCP_ENABLED=true
      - MCP_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - main_network
      - data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Enhanced PLC Simulator (Python) - PLC Replacement Server
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: virtplc-simulator
    ports:
      - "5000:8080"    # REST API & WebSocket
    environment:
      - PYTHONUNBUFFERED=1
      - SIMULATOR_MODE=plc-server
      - SIMULATOR_HOST=0.0.0.0
      - SIMULATOR_PORT=8080
      - MQTT_BROKER=virtplc-rabbitmq
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - UPDATE_INTERVAL=1.0
    volumes:
      - simulator-data:/app/data
    networks:
      - main_network
      - plc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/simulation/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.simulator.rule=Host(`simulator.localhost`)"
      - "traefik.http.services.simulator.loadbalancer.server.port=8080"

  # Simulator Monitoring Dashboard
  simulator-monitor:
    image: nginx:alpine
    container_name: virtplc-simulator-monitor
    ports:
      - "5002:80"
    volumes:
      - ./simulator/monitor.html:/usr/share/nginx/html/index.html
    depends_on:
      - simulator
    networks:
      - main_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_WS_URL=ws://localhost:3002
        - VITE_AI_API_URL=http://localhost/ai
        - VITE_API_BASE_URL=http://backend:8080
    container_name: virtplc-frontend
    expose:
      - "5173"   # Vite dev server (internal only, accessed via nginx)
    ports:
      - "3000:5173"   # Direct access for debugging (optional)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_WS_URL=ws://localhost:3002
      - VITE_AI_API_URL=http://localhost/ai
      - VITE_API_BASE_URL=http://localhost
    depends_on:
      - backend
      - ai-service
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: virtplc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Ollama Model Initializer
  ollama-init:
    image: curlimages/curl:latest
    container_name: virtplc-ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./ai-service/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - main_network
    restart: no

  # AI Analysis Service (Python + FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: virtplc-ai
    ports:
      - "3001:3001"   # REST API
      - "3002:3002"   # WebSocket
      - "9093:9091"   # gRPC API (internal port 9091, external 9093)
      - "9090:9090"   # Prometheus metrics
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=DEBUG
      - PORT=3001
      - GRPC_PORT=9091
      - WS_PORT=3002
      - BACKEND_API_URL=http://backend:8080
      - MCP_ENABLED=true
      - MCP_SERVER_URL=http://db-mcp-server:9092/sse
      - OLLAMA_HOST=http://ollama:11434
      # - OLLAMA_MODEL=llama3:8b
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - TIMESCALE_HOST=timescale
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=virtplc_ts
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=changeme
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANALYSIS_INTERVAL=5000
    volumes:
      - ./ai-service:/app
    depends_on:
      ollama:
        condition: service_started
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      timescale:
        condition: service_healthy
    networks:
      - main_network
      - data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PostgreSQL (Relational Data)
  postgres:
    image: postgres:16-alpine
    container_name: virtplc-postgres
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_DB=virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ai-service/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtplc -d virtplc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Caching & Sessions)
  redis:
    image: redis:7-alpine
    container_name: virtplc-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # TimescaleDB (Time Series Database)
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: virtplc-timescale
    ports:
      - "15433:5432"  # Use port 15433 to avoid conflict with postgres
    environment:
      - POSTGRES_DB=virtplc_ts
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./backend/init-timescale.sql:/docker-entrypoint-initdb.d/01-timescale-init.sql
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtplc -d virtplc_ts"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ MQTT Broker (replaces Mosquitto)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: virtplc-rabbitmq
    ports:
      - "1883:1883"  # MQTT port
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${MQTT_USERNAME:-virtplc}
      - RABBITMQ_DEFAULT_PASS=${MQTT_PASSWORD:-virtplc123}
      - RABBITMQ_PLUGINS=rabbitmq_management,rabbitmq_mqtt
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - plc_network
      - main_network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Node-RED MQTT Bridge
  nodered:
    image: nodered/node-red:latest
    container_name: virtplc-nodered
    ports:
      - "1880:1880"
      - "5020:5020"   # (Modbus TCP)
    volumes:
      - nodered-data:/data
      - ./nodered/flows:/data/flows
      - ./nodered/settings.js:/data/settings.js:ro
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-your-secret-key}
      - MQTT_BROKER=rabbitmq
      - MQTT_PORT=1883
    depends_on:
      - rabbitmq
    networks:
      - plc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ignition Edge with Perspective HMI
  ignition-edge:
    image: inductiveautomation/ignition:8.1.33
    container_name: virtplc-ignition-edge
    ports:
      - "8088:8088"   # Ignition Edge web interface
      - "8043:8043"   # HTTPS
      - "8060:8060"   # Gateway Network
    environment:
      - GATEWAY_ADMIN_USERNAME=admin
      - GATEWAY_ADMIN_PASSWORD=password
      - GATEWAY_HTTP_PORT=8088
      - GATEWAY_HTTPS_PORT=8043
      - IGNITION_EDITION=edge
      - ACCEPT_IGNITION_EULA=Y
    volumes:
      - ignition_data:/var/lib/ignition/data
      - ./HMI/IgnitionEdge:/var/lib/ignition/data/projects
    depends_on:
      - rabbitmq
    networks:
      - plc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/web/status/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # PAC Control runs on the actual PLC computer (not containerized)
  # Connects via network to RabbitMQ and other services

  collector:
    build: ./collector
    container_name: virtplc-collector
    environment:
      - MQTT_BROKER=virtplc-rabbitmq
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-virtplc}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-virtplc123}
      - TIMESCALE_HOST=timescale
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=${TIMESCALE_USER:-virtplc}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-changeme}
      - TIMESCALE_DB=${TIMESCALE_DB:-virtplc_ts}
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescale:
        condition: service_healthy
    ports:
      - "9100:9100"  # prometheus metrics
    networks:
      - main_network
      - plc_network
      - data_network
    restart: on-failure

  # Database MCP Server for AI access to TimescaleDB
  db-mcp-server:
    image: freepeak/db-mcp-server:latest
    container_name: virtplc-db-mcp-server
    ports:
      - "9092:9092"
    volumes:
      - ./db-mcp-config.json:/app/config.json:ro
    environment:
      - MCP_SERVER_PORT=9092
      - MCP_SERVER_CONFIG=/app/config.json
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - main_network
      - data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # TimescaleDB Cleanup Cronjob - runs every 2 months
  timescale-cleanup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.cleanup
    container_name: virtplc-timescale-cleanup
    environment:
      - TIMESCALE_HOST=timescale
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=virtplc_ts
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=changeme
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - main_network
      - data_network
    restart: unless-stopped
    labels:
      description: "Cronjob to clean up 25% of oldest data every 2 months"

networks:
  main_network:
    driver: bridge
    name: virtplc-main-network
  plc_network:
    driver: bridge
    name: virtplc-plc-network
  data_network:
    driver: bridge
    name: virtplc-data-network

volumes:
  ollama-data:
    name: virtplc-ollama-data
  postgres-data:
    name: virtplc-postgres-data
  redis-data:
    name: virtplc-redis-data
  timescale-data:
    name: virtplc-timescale-data
  simulator-data:
    name: virtplc-simulator-data
  nodered-data:
    name: virtplc-nodered-data
  rabbitmq-data:
    name: virtplc-rabbitmq-data
  ignition_data:
    name: virtplc-ignition-data
