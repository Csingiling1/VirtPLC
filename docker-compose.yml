version: '3.8'

services:
  # Spring Boot Backend with OPC-UA Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtplc-backend
    ports:
      - "8080:8080"   # REST API
      - "4840:4840"   # OPC-UA Server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - OPCUA_SERVER_PORT=4840
      - OPCUA_SERVER_ENDPOINT=opc.tcp://0.0.0.0:4840
      - TIMEBASE_URL=dts://timebase:8011
      - TIMEBASE_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/data/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: virtplc-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: virtplc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Note: Remove the GPU section above if you don't have NVIDIA GPU

  # AI Analysis Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: virtplc-ai
    ports:
      - "3001:3001"   # REST API
      - "3002:3002"   # WebSocket
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WS_PORT=3002
      - BACKEND_API_URL=http://backend:8080
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3:8b
      - ANALYSIS_INTERVAL=5000
    depends_on:
      ollama:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - virtplc-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # TimeBase Database (Optional - uncomment to enable)
  # timebase:
  #   image: finos/timebase-ce-server:6.0
  #   container_name: virtplc-timebase
  #   ports:
  #     - "8011:8011"  # TimeBase port
  #     - "8099:8099"  # Web Admin
  #   environment:
  #     - TIMEBASE_OPTS=-Xmx2g
  #   volumes:
  #     - timebase-data:/timebase/data
  #   networks:
  #     - virtplc-network
  #   restart: unless-stopped

  # Ignition Gateway (HMI) - External service, documented for reference
  # Users should run Ignition Edge separately and configure OPC-UA connection to opc.tcp://backend:4840
  # Ignition Web UI: http://localhost:8088
  # See feature/HMI branch for configuration files

networks:
  virtplc-network:
    driver: bridge
    name: virtplc-network

volumes:
  ollama-data:
    name: virtplc-ollama-data
  # Uncomment if using TimeBase
  # timebase-data:
  #   name: virtplc-timebase-data
