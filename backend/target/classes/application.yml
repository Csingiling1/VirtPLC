spring:
  application:
    name: virtplc-backend
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://localhost:5433/timescaledb
    username: timescale
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  # Redis Cache Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    redis:
      time-to-live: 30000 # Default TTL: 30 seconds

server:
  port: 8080

timescaledb:
  url: jdbc:postgresql://localhost:5433/timescaledb
  username: timescale
  password: changeme
  driver-class-name: org.postgresql.Driver
  enabled: true

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8088
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

# OAuth2 Configuration
security:
  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID:}
          client-secret: ${GOOGLE_CLIENT_SECRET:}
          scope: openid,email,profile
          redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        microsoft:
          client-id: ${MICROSOFT_CLIENT_ID:}
          client-secret: ${MICROSOFT_CLIENT_SECRET:}
          scope: openid,email,profile
          redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        ignition:
          client-id: ${IGNITION_CLIENT_ID:}
          client-secret: ${IGNITION_CLIENT_SECRET:}
          scope: openid,email,profile
          redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

logging:
  level:
    com.virtplc: DEBUG
    org.springframework.security: DEBUG

# Actuator and Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    diskspace:
      enabled: true
    db:
      enabled: true

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true

# Custom Metrics Configuration
metrics:
  custom:
    enabled: true

# MCP Configuration
mcp:
  enabled: true

# Alerting Configuration
virtplc:
  alerting:
    websocket:
      max-connections: 100
    pipeline:
      max-backpressure: 1000
    memory:
      warning-percent: 85
      critical-percent: 95
