spring:
  application:
    name: virtplc-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/timescaledb
    username: timescale
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

timescaledb:
  url: jdbc:postgresql://localhost:5433/timescaledb
  username: timescale
  password: changeme
  driver-class-name: org.postgresql.Driver
  enabled: true

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8088
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

logging:
  level:
    com.virtplc: DEBUG
    org.eclipse.milo: INFO
    org.springframework.security: DEBUG
