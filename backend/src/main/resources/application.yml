spring:
  application:
    name: virtplc-backend

server:
  port: 8080
  
opcua:
  server:
    enabled: true
    port: 4840
    endpoint: opc.tcp://0.0.0.0:4840
    namespace: http://virtplc.accenture.com/factory
    
security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
    expiration: 86400000  # 24 hours in milliseconds
    
timebase:
  url: dts://localhost:8011
  username: admin
  password: changeme
  enabled: false  # Enable when TimeBase is configured

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8088
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

logging:
  level:
    com.virtplc: DEBUG
    org.eclipse.milo: INFO
    org.springframework.security: DEBUG
