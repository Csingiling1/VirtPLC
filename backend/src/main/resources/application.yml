spring:
  application:
    name: virtplc-backend
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://localhost:5433/timescaledb
    username: timescale
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

timescaledb:
  url: jdbc:postgresql://localhost:5433/timescaledb
  username: timescale
  password: changeme
  driver-class-name: org.postgresql.Driver
  enabled: true

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8088
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

logging:
  level:
    com.virtplc: DEBUG
    org.springframework.security: DEBUG

# Actuator and Metrics Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    diskspace:
      enabled: true
    db:
      enabled: true

# Custom Metrics Configuration
metrics:
  custom:
    enabled: true

# MCP Configuration
mcp:
  enabled: true

# Alerting Configuration
virtplc:
  alerting:
    websocket:
      max-connections: 100
    pipeline:
      max-backpressure: 1000
    memory:
      warning-percent: 85
      critical-percent: 95
