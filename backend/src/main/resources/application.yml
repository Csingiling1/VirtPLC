spring:
  application:
    name: virtplc-backend

server:
  port: 8080
  
opcua:
  server:
    enabled: true
    port: 4840
    endpoint: opc.tcp://0.0.0.0:4840
    namespace: http://virtplc.accenture.com/factory
    
security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
    expiration: 86400000  # 24 hours in milliseconds
    
timescaledb:
  url: jdbc:postgresql://timescale:5432/timescaledb
  username: timescale
  password: changeme
  driver-class-name: org.postgresql.Driver
  enabled: true

opcua:
  client:
    enabled: true
    endpoint: opc.tcp://plc-simulator:4840
    security-policy: None
    message-security: None
    request-timeout: 5000
    session-timeout: 60000

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8088
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

logging:
  level:
    com.virtplc: DEBUG
    org.eclipse.milo: INFO
    org.springframework.security: DEBUG
