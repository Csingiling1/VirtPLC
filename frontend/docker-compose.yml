version: '3.8'

# FRONTEND STACK - React + Redis + Nginx
# Deploy in: /frontend directory

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: virtplc/frontend:latest
    container_name: frontend
    hostname: frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_AI_URL=${VITE_AI_URL:-http://localhost:8000}
      - VITE_IGNITION_URL=${VITE_IGNITION_URL:-http://localhost:8088}
      - REDIS_HOST=redis-frontend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend-network
      - virtplc-shared
    depends_on:
      - redis-frontend

  redis-frontend:
    image: redis:7-alpine
    container_name: redis-frontend
    hostname: redis-frontend
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
      --loglevel notice
    volumes:
      - redis-frontend-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend-network

volumes:
  redis-frontend-data:

networks:
  frontend-network:
    driver: bridge
  virtplc-shared:
    external: true
