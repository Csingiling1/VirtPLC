server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: virtplc-system
    static_configs:
      - targets:
          - localhost
        labels:
          job: virtplc-system
          __path__: /var/log/containers/*virtplc*.log
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            time: time
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano

  - job_name: virtplc-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: container-logs
          __path__: /var/log/containers/*virtplc*.log
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            time: time
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
