global:
  smtp_smarthost: "localhost:587"
  smtp_from: "alertmanager@virtplc.com"

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "email-notifications"
  routes:
    - match:
        severity: critical
      receiver: "critical-notifications"

receivers:
  - name: "email-notifications"
    email_configs:
      - to: "admin@virtplc.com"
        send_resolved: true

  - name: "critical-notifications"
    email_configs:
      - to: "admin@virtplc.com"
        send_resolved: true
    slack_configs:
      - api_url: "YOUR_SLACK_WEBHOOK_URL"
        channel: "#alerts"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "dev", "instance"]
