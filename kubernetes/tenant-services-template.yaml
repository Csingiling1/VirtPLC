apiVersion: v1
kind: Service
metadata:
  name: virtplc-backend
  namespace: { { TENANT_NAMESPACE } }
  labels:
    app: virtplc-backend
    tenant: { { TENANT_ID } }
spec:
  selector:
    app: virtplc-backend
    tenant: { { TENANT_ID } }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: virtplc-ai-service
  namespace: { { TENANT_NAMESPACE } }
  labels:
    app: virtplc-ai-service
    tenant: { { TENANT_ID } }
spec:
  selector:
    app: virtplc-ai-service
    tenant: { { TENANT_ID } }
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: virtplc-frontend
  namespace: { { TENANT_NAMESPACE } }
  labels:
    app: virtplc-frontend
    tenant: { { TENANT_ID } }
spec:
  selector:
    app: virtplc-frontend
    tenant: { { TENANT_ID } }
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-ingress
  namespace: { { TENANT_NAMESPACE } }
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "{{TENANT_DOMAIN}}"
        - "api.{{TENANT_DOMAIN}}"
      secretName: tenant-tls-{{TENANT_ID}}
  rules:
    - host: "{{TENANT_DOMAIN}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: virtplc-frontend
                port:
                  number: 80
    - host: "api.{{TENANT_DOMAIN}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: virtplc-backend
                port:
                  number: 8080
