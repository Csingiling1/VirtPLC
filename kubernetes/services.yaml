apiVersion: v1
kind: Service
metadata:
  name: virtplc-postgres
  namespace: virtplc-system
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None # Headless service for stateful set
---
apiVersion: v1
kind: Service
metadata:
  name: virtplc-redis
  namespace: virtplc-system
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: virtplc-system
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
# Shared ingress for all tenants
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: virtplc-ingress
  namespace: virtplc-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.virtplc.com"
      secretName: virtplc-tls
  rules:
    - host: "*.virtplc.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: virtplc-frontend
                port:
                  number: 80
