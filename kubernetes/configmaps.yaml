apiVersion: v1
kind: ConfigMap
metadata:
  name: virtplc-shared-config
  namespace: virtplc-system
data:
  # Shared configuration for all tenants
  SPRING_PROFILES_ACTIVE: "prod,k8s"
  JAVA_OPTS: "-Xmx1g -Xms512m"
  POSTGRES_DB: "virtplc"
  REDIS_HOST: "virtplc-redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-config
  namespace: virtplc-system
data:
  OLLAMA_BASE_URL: "http://ollama-service.virtplc-system.svc.cluster.local:11434"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
---
# Tenant-specific config template
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-config-template
  namespace: virtplc-system
data:
  TENANT_ID: "placeholder"
  DB_HOST: "placeholder"
  DB_PORT: "5432"
  JWT_SECRET: "placeholder"
  COMPANY_DOMAIN: "placeholder"
