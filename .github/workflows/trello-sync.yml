name: Taiga User Story Sync

on:
  push:
    branches: [main, release, develop]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  sync-commit-to-taiga:
    name: Sync Commit to Taiga
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Extract Taiga User Story and Comment
        env:
          TAIGA_API_TOKEN: ${{ secrets.TAIGA_API_TOKEN }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"

          US_ID=$(echo "$COMMIT_MSG" | grep -oP '(?:https://tree\.taiga\.io/[^/]+/us/|#)([0-9]+)' | tail -1 | sed 's/.*\///' | sed 's/#//')

          if [ -n "$US_ID" ]; then
            echo "Found Taiga user story: $US_ID"
            
            COMMENT="Commit by ${COMMIT_AUTHOR} on branch ${{ github.ref_name }}: ${COMMIT_MSG:0:200}. View at ${COMMIT_URL}"
            
            curl -X POST "https://api.taiga.io/api/v1/userstories/${US_ID}/comments" \
              -H "Authorization: Bearer ${TAIGA_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"comment\": \"$COMMENT\"}"
          fi

  sync-pr-to-taiga:
    name: Sync PR to Taiga
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Update Taiga on PR Event
        env:
          TAIGA_API_TOKEN: ${{ secrets.TAIGA_API_TOKEN }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_MERGED="${{ github.event.pull_request.merged }}"

          US_ID=$(echo "$PR_TITLE $PR_BODY" | grep -oP '(?:https://tree\.taiga\.io/[^/]+/us/|#)([0-9]+)' | head -1 | sed 's/.*\///' | sed 's/#//')

          if [ -n "$US_ID" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              COMMENT="PR #${{ github.event.pull_request.number }} merged! View at ${PR_URL}"
              
              # Optionally update status to Done (assuming status ID 4 for Done; check your Taiga project settings)
              curl -X PATCH "https://api.taiga.io/api/v1/userstories/${US_ID}" \
                -H "Authorization: Bearer ${TAIGA_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"status\": 4}"
            else
              COMMENT="PR #${{ github.event.pull_request.number }} ${{ github.event.action }}: ${PR_TITLE}. View at ${PR_URL}"
            fi
            
            curl -X POST "https://api.taiga.io/api/v1/userstories/${US_ID}/comments" \
              -H "Authorization: Bearer ${TAIGA_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"comment\": \"$COMMENT\"}"
          fi
