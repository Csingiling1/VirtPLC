name: HMI CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/HMI]
    paths:
      - "HMI/**"
      - ".github/workflows/hmi-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "HMI/**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-validate:
    name: Lint and Validate Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint xmllint pyyaml lxml

      - name: Validate YAML files
        run: |
          yamllint HMI/TimeBaseDB/config/*.yaml || true

      - name: Validate XML files
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys

          files = [
            'HMI/IgnitionEdge/config/gateway.xml',
            'HMI/TimeBaseDB/config/schemas.xml'
          ]

          for f in files:
            try:
              ET.parse(f)
              print(f'✓ {f} is valid XML')
            except ET.ParseError as e:
              print(f'✗ {f} has XML errors: {e}')
              sys.exit(1)
          "

      - name: Validate JSON files
        run: |
          python -c "
          import json
          import sys
          from pathlib import Path

          json_files = list(Path('HMI').rglob('*.json'))

          for f in json_files:
            try:
              with open(f, 'r') as file:
                json.load(file)
              print(f'✓ {f} is valid JSON')
            except json.JSONDecodeError as e:
              print(f'✗ {f} has JSON errors: {e}')
              sys.exit(1)
          "

      - name: Check Structured Text syntax
        run: |
          # Basic syntax check for ST files
          find HMI/PLCLogic/structured -name "*.st" -exec echo "Checking {}" \;

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd HMI/tests
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd HMI
          pytest tests/test_tag_operations.py -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./HMI/coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd HMI/tests
          pip install -r requirements.txt

      - name: Run integration tests
        run: |
          cd HMI
          pytest tests/test_integration.py -v -m "not e2e"

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: HMI/test-results/

  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name != 'pull_request'

    services:
      selenium:
        image: selenium/standalone-chrome:latest
        options: >-
          --shm-size=2gb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd HMI/tests
          pip install -r requirements.txt

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Start mock HMI server
        run: |
          # In production, this would start actual Ignition Gateway
          # For CI, we'll skip or use mock server
          echo "Mock HMI server would start here"

      - name: Run E2E tests
        run: |
          cd HMI
          pytest tests/test_e2e.py -v -m "e2e" --tb=short || true

      - name: Upload E2E test screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-screenshots
          path: HMI/test-results/screenshots/

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "HMI"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate documentation
        run: |
          echo "# HMI Documentation" > HMI/docs/README.md
          echo "Generated on $(date)" >> HMI/docs/README.md

          # List all views
          echo "## Views" >> HMI/docs/README.md
          find HMI/IgnitionEdge/projects/VirtPLC-HMI/views -type d -mindepth 1 -maxdepth 1 -exec basename {} \; >> HMI/docs/README.md

          # List all scripts
          echo "## Scripts" >> HMI/docs/README.md
          find HMI/IgnitionEdge/projects/VirtPLC-HMI/scripts -name "*.py" -exec basename {} \; >> HMI/docs/README.md

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: hmi-documentation
          path: HMI/docs/

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_USERNAME != ''

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: virtplc/hmi
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./HMI
          file: ./HMI/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-tests, build-docker-image]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: http://staging.virtplc.local:8088

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here
          # e.g., kubectl apply, docker-compose up, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests, build-docker-image]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://prod.virtplc.local:8088

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment commands here
          # Include blue-green deployment strategy

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, security-scan]
    if: always()

    steps:
      - name: Send notification
        run: |
          echo "Pipeline completed with status: ${{ job.status }}"
          # Add Slack/Teams/Email notification here
