version: '3.8'

# BACKEND SERVER STACK
# Deploy this on your central server (cloud, on-premise, or powerful workstation)
# This handles all data storage, historical logging, and monitoring

services:
  # TimescaleDB - Time-series database for historical data
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: virtplc-backend-timescale
    hostname: timescale
    ports:
      - "5432:5432" # PostgreSQL port
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ../backend/init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql:ro
    environment:
      - POSTGRES_DB=virtplc_ts
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U virtplc -d virtplc_ts" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      virtplc-backend:
        ipv4_address: 172.21.0.10

  # PostgreSQL - Relational database for user data, alarms, dashboards
  postgres:
    image: postgres:15-alpine
    container_name: virtplc-backend-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./IgnitionEdge/config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-virtplc}
      - POSTGRES_USER=${POSTGRES_USER:-virtplc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_MAX_CONNECTIONS=100
      - POSTGRES_SHARED_BUFFERS=256MB
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U virtplc" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      virtplc-backend:
        ipv4_address: 172.21.0.11

  # Redis - Caching layer for performance
  redis:
    image: redis:7-alpine
    container_name: virtplc-backend-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      virtplc-backend:
        ipv4_address: 172.21.0.12

  # Grafana - Monitoring and visualization
  grafana:
    image: grafana/grafana:latest
    container_name: virtplc-backend-grafana
    hostname: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      virtplc-backend:
        ipv4_address: 172.21.0.13
    depends_on:
      - postgres
      - prometheus

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: virtplc-backend-prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      virtplc-backend:
        ipv4_address: 172.21.0.14

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: virtplc-backend-node-exporter
    hostname: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped
    networks:
      virtplc-backend:
        ipv4_address: 172.21.0.15

volumes:
  timescale-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  virtplc-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

# Usage:
#   docker-compose -f docker-compose.backend.yml up -d
#
# Access:
#   Grafana:     http://<server-ip>:3000
#   Prometheus:  http://<server-ip>:9090
#   TimeBase:    http://<server-ip>:8011
#   PostgreSQL:  postgresql://<server-ip>:5432/virtplc
#   Redis:       redis://<server-ip>:6379
