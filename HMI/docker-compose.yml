version: '3.8'

# EDGE STACK - Ignition Edge + Local Redis + PLC Simulator
# Deploy in: /HMI directory

services:
  ignition-edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: virtplc/ignition-edge:latest
    container_name: ignition-edge
    hostname: ignition-edge
    ports:
      - "8088:8088"   # HTTP
      - "8043:8043"   # HTTPS
      - "8060:8060"   # Gateway Network
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./IgnitionEdge/projects:/projects:ro
      # - ./IgnitionEdge/config/gateway.xml:/usr/local/bin/ignition/data/gateway.xml:ro
      # - ./IgnitionEdge/tags:/usr/local/bin/ignition/data/tags:ro
    environment:
      - GATEWAY_ADMIN_USERNAME=${GATEWAY_ADMIN_USERNAME:-admin}
      - GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD:-password}
      - ACCEPT_IGNITION_EULA=Y
      - JAVA_OPTS=-Xmx1g -Xms512m
      - REDIS_HOST=redis-edge
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8088/StatusPing"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 120s
    restart: unless-stopped
    networks:
      - edge-network
    # depends_on:
    #   - redis-edge

  redis-edge:
    image: redis:7-alpine
    container_name: redis-edge
    hostname: redis-edge
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --loglevel notice
    volumes:
      - redis-edge-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edge-network

volumes:
  ignition-data:
  redis-edge-data:

networks:
  edge-network:
    driver: bridge
