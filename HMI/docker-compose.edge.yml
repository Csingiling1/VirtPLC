version: '3.8'

# EDGE DEVICE STACK
# Deploy this on edge devices (tablets, industrial PCs, Raspberry Pi)
# Configure BACKEND_SERVER_IP in .env to point to your backend server

services:
  # Ignition Edge Gateway - HMI/SCADA edge server
  ignition-edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: virtplc/ignition-edge:latest
    container_name: virtplc-edge-gateway
    hostname: ignition-edge
    ports:
      - "8088:8088"   # HTTP Web Interface
      - "8043:8043"   # HTTPS Web Interface
      - "8060:8060"   # Gateway Network
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./IgnitionEdge/projects:/projects:ro
      - ./IgnitionEdge/config/gateway.xml:/usr/local/bin/ignition/data/gateway.xml:ro
      - ./IgnitionEdge/tags:/tags:ro
    environment:
      - GATEWAY_ADMIN_USERNAME=${GATEWAY_ADMIN_USERNAME:-admin}
      - GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD:-password}
      - GATEWAY_USESSL=${GATEWAY_USESSL:-false}
      - IGNITION_EDITION=edge
      - GATEWAY_NETWORK_AUTOACCEPT=true
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Backend server connection
      - BACKEND_SERVER=${BACKEND_SERVER_IP:-192.168.1.100}
      - TIMEBASE_URL=http://${BACKEND_SERVER_IP:-192.168.1.100}:8011
      - POSTGRES_HOST=${BACKEND_SERVER_IP:-192.168.1.100}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-virtplc}
      - POSTGRES_USER=${POSTGRES_USER:-virtplc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=${BACKEND_SERVER_IP:-192.168.1.100}
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      virtplc-edge:
        ipv4_address: 172.22.0.10
    depends_on:
      - plc-simulator

  # PLC Simulator - Generates realistic factory signals
  plc-simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    image: virtplc/plc-simulator:latest
    container_name: virtplc-plc-simulator
    hostname: plc-simulator
    ports:
      - "4840:4840"   # OPC-UA Server
      - "8080:8080"   # Web UI/API
    volumes:
      - simulator-data:/data
      - ./simulator/config.yaml:/app/config.yaml:ro
    environment:
      - OPCUA_PORT=4840
      - OPCUA_ENDPOINT=opc.tcp://0.0.0.0:4840
      - WEB_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SIMULATION_SPEED=${SIMULATION_SPEED:-1.0}
      # Equipment configuration
      - NUM_MOTORS=2
      - NUM_CONVEYORS=1
      - ENABLE_FAULTS=${ENABLE_FAULTS:-true}
      - FAULT_PROBABILITY=${FAULT_PROBABILITY:-0.01}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      virtplc-edge:
        ipv4_address: 172.22.0.11

volumes:
  ignition-data:
    driver: local
  simulator-data:
    driver: local

networks:
  virtplc-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1

# Usage:
#   1. Configure backend server IP in .env:
#      BACKEND_SERVER_IP=192.168.1.100
#
#   2. Start edge services:
#      docker-compose -f docker-compose.edge.yml up -d
#
#   3. Access HMI from any device on the network:
#      http://<edge-device-ip>:8088/data/perspective/client/VirtPLC-HMI
#
#   4. View simulator dashboard:
#      http://<edge-device-ip>:8080
#
# Examples:
#   - Tablet: http://192.168.1.50:8088/data/perspective/client/VirtPLC-HMI
#   - Phone: http://192.168.1.50:8088/data/perspective/client/VirtPLC-HMI
#   - Laptop: http://192.168.1.50:8088/data/perspective/client/VirtPLC-HMI
