# Production Profile - 3 Servers
# Server 1 (Windows): PLC + Ignition Edge + Node-RED (separate compose)
# Server 2 (Linux): Collector, Backend, Frontend, AI-Service, Redis, Postgres
# Server 3 (Linux): TimescaleDB only
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  backend:
    environment:
      - PROFILE=production
      - DATA_SOURCE=simulator
      # TimescaleDB on Server 3
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${SERVER3_HOST:-192.168.1.30}:5432/virtplc_ts
      - SPRING_DATASOURCE_USERNAME=virtplc
      - SPRING_DATASOURCE_PASSWORD=${TIMESCALE_PASSWORD:-changeme}
    extra_hosts:
      - "plc-server:${SERVER1_HOST:-192.168.1.10}"
      - "db-server:${SERVER3_HOST:-192.168.1.30}"
    depends_on:
      - postgres
      - redis
    profiles:
      - prod

  # Simulator not needed in production
  simulator:
    profiles:
      - disabled

  simulator-monitor:
    profiles:
      - disabled

  frontend:
    build:
      args:
        - VITE_API_BASE_URL=http://${SERVER2_HOST:-localhost}:18080
        - VITE_WS_URL=ws://${SERVER2_HOST:-localhost}:3002
        - VITE_AI_API_URL=http://${SERVER2_HOST:-localhost}:3001
    environment:
      - PROFILE=production
    profiles:
      - prod

  ollama:
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - prod

  ollama-init:
    environment:
      - OLLAMA_MODEL=mistral-nemo
    profiles:
      - prod

  ai-service:
    environment:
      - PROFILE=production
      - BACKEND_API_URL=http://backend:8080
      # TimescaleDB on Server 3
      - TIMESCALE_HOST=${SERVER3_HOST:-192.168.1.30}
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=virtplc_ts
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-changeme}
      # Postgres on Server 2
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - OLLAMA_MODEL=mistral-nemo
    extra_hosts:
      - "db-server:${SERVER3_HOST:-192.168.1.30}"
    depends_on:
      - postgres
      - redis
    profiles:
      - prod

  # Postgres on Server 2
  postgres:
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    profiles:
      - prod

  # Redis on Server 2
  redis:
    profiles:
      - prod

  # TimescaleDB EXCLUDED from Server 2 - runs on Server 3
  timescale:
    profiles:
      - disabled

  # Ignition Edge excluded - runs on Server 1 with real PLC
  ignition-edge:
    profiles:
      - disabled

  # MQTT excluded - handled by Node-RED on Server 1
  mqtt:
    profiles:
      - disabled

  # Collector on Server 2 - receives MQTT from Node-RED on Server 1
  collector:
    environment:
      - PROFILE=production
      # TimescaleDB on Server 3
      - TIMESCALE_HOST=${SERVER3_HOST:-192.168.1.30}
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-changeme}
      - TIMESCALE_DB=virtplc_ts
    extra_hosts:
      - "plc-server:${SERVER1_HOST:-192.168.1.10}"
      - "db-server:${SERVER3_HOST:-192.168.1.30}"
    profiles:
      - prod

  # DB MCP Server on Server 2 - connects to TimescaleDB on Server 3
  db-mcp-server:
    environment:
      - TIMESCALE_HOST=${SERVER3_HOST:-192.168.1.30}
    extra_hosts:
      - "db-server:${SERVER3_HOST:-192.168.1.30}"
    profiles:
      - prod

  # Node-RED excluded from Server 2 - runs on Server 1 with PLC
  nodered:
    profiles:
      - disabled
