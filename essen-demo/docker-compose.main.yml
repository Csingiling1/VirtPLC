version: '3.8'

# Main Application Server Setup
# Components: Backend, Frontend, AI Service, Collector, and supporting services
# Purpose: Main application logic, APIs, and user interfaces

services:
  # Spring Boot Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: virtplc-backend
    ports:
      - "18080:8080"   # REST API
      - "8000:8000"   # MCP Server
      - "9091:9090"   # gRPC Server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SIMULATOR_API_URL=http://${WINDOWS_IP}:5000
      - SIMULATOR_WS_URL=ws://${WINDOWS_IP}:5000/ws/data
      - SIMULATOR_BASE_URL=http://${WINDOWS_IP}:5000
      - DATA_SOURCE=simulator
      - SIMULATOR_NAME=VirtPLC Simulator
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${HISTORIAN_IP}:5432/virtplc
      - SPRING_DATASOURCE_USERNAME=virtplc
      - SPRING_DATASOURCE_PASSWORD=changeme
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - MCP_ENABLED=true
      - MCP_PORT=8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - POSTGRES_URL=jdbc:postgresql://${HISTORIAN_IP}:5432/virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
    networks:
      - main_network
      - data_network
      - plc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_WS_URL=ws://localhost:3002
        - VITE_AI_API_URL=http://localhost:3001
        - VITE_API_BASE_URL=http://localhost:18080
    container_name: virtplc-frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      - backend
      - ai-service
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: virtplc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "echo", "ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Ollama Model Initializer
  ollama-init:
    image: curlimages/curl:latest
    container_name: virtplc-ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ../ai-service/init-ollama.sh:/init-ollama.sh
    entrypoint: ["/bin/sh", "/init-ollama.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - main_network
    restart: "no"

  # AI Analysis Service (Python + FastAPI)
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: virtplc-ai
    ports:
      - "3001:3001"   # REST API
      - "3002:3002"   # WebSocket
      - "9090:9090"   # Prometheus metrics
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=DEBUG
      - PORT=3001
      - WS_PORT=3002
      - BACKEND_API_URL=http://backend:8080
      - MCP_ENABLED=true
      - MCP_SERVER_URL=http://db-mcp-server:9092/sse
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - TIMESCALE_HOST=${HISTORIAN_IP}
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=virtplc_ts
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=changeme
      - POSTGRES_HOST=${HISTORIAN_IP}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=virtplc
      - POSTGRES_USER=virtplc
      - POSTGRES_PASSWORD=changeme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANALYSIS_INTERVAL=5000
    volumes:
      - ../ai-service:/app
    depends_on:
      ollama:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - main_network
      - data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis (Caching & Sessions)
  redis:
    image: redis:7-alpine
    container_name: virtplc-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Collector service for data ingestion
  collector:
    build: ../collector
    container_name: virtplc-collector
    environment:
      - MQTT_BROKER=${PLC_IP}
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-virtplc}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-virtplc123}
      - TIMESCALE_HOST=${HISTORIAN_IP}
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=${TIMESCALE_USER:-virtplc}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-changeme}
      - TIMESCALE_DB=${TIMESCALE_DB:-virtplc_ts}
    ports:
      - "9100:9100"  # prometheus metrics
    networks:
      - main_network
      - data_network
      - plc_network
    restart: on-failure

  # Database MCP Server for AI access to TimescaleDB
  db-mcp-server:
    image: freepeak/db-mcp-server:latest
    container_name: virtplc-db-mcp-server
    ports:
      - "9092:9092"
    volumes:
      - ../db-mcp-config.json:/app/config.json:ro
    environment:
      - MCP_SERVER_PORT=9092
      - MCP_SERVER_CONFIG=/app/config.json
    networks:
      - main_network
      - data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # TimescaleDB Cleanup Cronjob - runs every 2 months
  timescale-cleanup:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.cleanup
    container_name: virtplc-timescale-cleanup
    environment:
      - TIMESCALE_HOST=${HISTORIAN_IP}
      - TIMESCALE_PORT=5432
      - TIMESCALE_DB=virtplc_ts
      - TIMESCALE_USER=virtplc
      - TIMESCALE_PASSWORD=changeme
    networks:
      - main_network
      - data_network
    restart: unless-stopped

volumes:
  ollama-data:
    name: virtplc-ollama-data
  redis-data:
    name: virtplc-redis-data
  simulator-data:
    name: virtplc-simulator-data

networks:
  main_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  data_network:
    external: true
    name: virtplc_data_network
  plc_network:
    external: true
    name: virtplc_plc_network