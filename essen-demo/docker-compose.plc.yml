version: '3.8'

# PLC Computer Setup (Gaming PC with Unreal Engine)
# Components: Ignition Edge, Node-RED, RabbitMQ
# Purpose: PLC simulation and data collection from Unreal Engine

services:
  # RabbitMQ MQTT Broker (replaces Mosquitto)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: virtplc-rabbitmq
    ports:
      - "1883:1883"  # MQTT port
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${MQTT_USERNAME:-virtplc}
      - RABBITMQ_DEFAULT_PASS=${MQTT_PASSWORD:-virtplc123}
      - RABBITMQ_PLUGINS=rabbitmq_management,rabbitmq_mqtt
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - plc_network
    restart: unless-stopped

  # Node-RED MQTT Bridge
  nodered:
    image: nodered/node-red:latest
    container_name: virtplc-nodered
    ports:
      - "1880:1880"   # Node-RED UI
    volumes:
      - nodered-data:/data
      - ./nodered/flows:/data/flows
      - ./nodered/settings.js:/data/settings.js:ro
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-your-secret-key}
      - MQTT_BROKER=rabbitmq
      - MQTT_PORT=1883
    depends_on:
      - rabbitmq
    networks:
      - plc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ignition Edge for PLC simulation
  ignition:
    image: inductiveautomation/ignition:8.1.33
    container_name: virtplc-ignition
    restart: unless-stopped
    environment:
      GATEWAY_ADMIN_PASSWORD: admin
      IGNITION_EDITION: edge
    ports:
      - "8088:8088"    # Gateway web interface
      - "8043:8043"    # HTTPS
      - "8089:8089"    # Gateway network
    volumes:
      - ignition_data:/var/lib/ignition/data
      - ./HMI/IgnitionEdge:/var/lib/ignition/data/projects
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - plc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 60s
      timeout: 30s
      retries: 5

volumes:
  rabbitmq-data:
    name: virtplc-rabbitmq-data
  nodered-data:
    name: virtplc-nodered-data
  ignition_data:

networks:
  plc_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16