# Stage2 Profile - Pre-Production (2 Computers)
# Computer 1: Main Stack (collector, timescale, backend, frontend, ai-service)
# Computer 2: Unreal Engine + PLC with Node-RED (separate compose)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.stage2.yml up

version: '3.8'

services:
  backend:
    environment:
      - PROFILE=stage2
      - DATA_SOURCE=simulator
    extra_hosts:
      - "plc:${PLC_HOST:-192.168.1.100}"
    profiles:
      - stage2

  # Simulator not needed in stage2 - real Unreal Engine on Computer 2
  simulator:
    profiles:
      - disabled

  simulator-monitor:
    profiles:
      - disabled

  frontend:
    build:
      args:
        - VITE_API_BASE_URL=http://${COMPUTER1_HOST:-localhost}:18080
        - VITE_WS_URL=ws://${COMPUTER1_HOST:-localhost}:3002
        - VITE_AI_API_URL=http://${COMPUTER1_HOST:-localhost}:3001
    environment:
      - PROFILE=stage2
    profiles:
      - stage2

  ollama:
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - stage2

  ollama-init:
    environment:
      - OLLAMA_MODEL=qwen2.5:7b
    profiles:
      - stage2

  ai-service:
    environment:
      - PROFILE=stage2
      - BACKEND_API_URL=http://backend:8080
      - OLLAMA_MODEL=qwen2.5:7b
    profiles:
      - stage2

  postgres:
    profiles:
      - stage2

  redis:
    profiles:
      - stage2

  timescale:
    profiles:
      - stage2

  # Ignition Edge not used in stage2 - real PLC on Computer 2
  ignition-edge:
    profiles:
      - disabled

  # MQTT broker on Computer 1 - receives from Computer 2
  mqtt:
    ports:
      - "1883:1883"
    profiles:
      - stage2

  # Collector receives MQTT from Node-RED on Computer 2
  collector:
    environment:
      - PROFILE=stage2
      - MQTT_BROKER=mqtt
    extra_hosts:
      - "plc:${PLC_HOST:-192.168.1.100}"
    profiles:
      - stage2

  db-mcp-server:
    profiles:
      - stage2

  # Node-RED excluded from Computer 1 in stage2 - runs on PLC (Computer 2)
  nodered:
    profiles:
      - disabled
