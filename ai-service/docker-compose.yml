version: '3.8'

# AI/MCP STACK - FastAPI + Redis + MCP Client
# Deploy in: /ai-service directory

services:
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: virtplc/ai-service:latest
    container_name: ai-backend
    hostname: ai-backend
    ports:
      - "8000:8000"   # FastAPI
    volumes:
      - ./src:/app/src:ro
      - ai-models:/models
      - ai-logs:/logs
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_HOST=redis-ai
      - REDIS_PORT=6379
      - REDIS_DB=0
      # Database connections
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-virtplc}
      - POSTGRES_USER=${POSTGRES_USER:-virtplc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      # TimescaleDB
      - TIMESCALE_URL=${TIMESCALE_URL:-postgresql://timescale:5432/timescaledb}
      - TIMESCALE_USER=${TIMESCALE_USER:-timescale}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-changeme}
      # MCP
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
      # AI Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Ollama
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:8b-instruct-q8_0}
      # Alternative models (uncomment to use):
      # - OLLAMA_MODEL=llama3.2:17b-instruct-q8_0  # Better accuracy, slower
      # - OLLAMA_MODEL=llama3.2:8b-instruct-fp16    # Higher precision, more memory
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ai-network
      - virtplc-shared
    depends_on:
      - redis-ai
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    ports:
      - "11434:11434"   # Ollama API
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      # Enable GPU if available (uncomment for NVIDIA GPU)
      # - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    # Uncomment for NVIDIA GPU support
    # runtime: nvidia
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai-network
      - virtplc-shared

  # Ollama model loader - pulls models on first start
  ollama-setup:
    image: ollama/ollama:latest
    container_name: ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama to be ready...' &&
      sleep 10 &&
      echo 'Pulling llama3.2:8b-instruct-q8_0 (quantized, KV cached)...' &&
      ollama pull llama3.2:8b-instruct-q8_0 &&
      echo 'Model pulled successfully!' &&
      echo 'For better performance, optionally pull 17B model:' &&
      echo '  docker exec ollama ollama pull llama3.2:17b-instruct-q8_0'
      "
    environment:
      - OLLAMA_HOST=ollama:11434
    networks:
      - ai-network
    restart: "no"

  redis-ai:
    image: redis:7-alpine
    container_name: redis-ai
    hostname: redis-ai
    ports:
      - "6381:6379"
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --loglevel notice
    volumes:
      - redis-ai-data:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ai-network

volumes:
  redis-ai-data:
  ai-models:
  ai-logs:
  ollama-models:

networks:
  ai-network:
    driver: bridge
  virtplc-shared:
    external: true
