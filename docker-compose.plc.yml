# PLC Node-RED Compose - For Stage2 and Production
# Deploy this on the PLC/Computer 2 (Stage2) or Server 1 (Production)
# This receives MQTT from Unreal Engine and forwards/transforms it
# Usage: docker-compose -f docker-compose.plc.yml up

version: '3.8'

services:
  # Ignition Edge HMI
  ignition-edge:
    image: inductiveautomation/ignition:8.1.28
    container_name: plc-ignition-edge
    ports:
      - "8088:8088"   # Gateway web interface
      - "8043:8043"   # SSL
      - "8060:8060"   # Perspective
    environment:
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: password
      ACCEPT_IGNITION_EULA: Y
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ./HMI/IgnitionEdge:/restore
    networks:
      - plc-network
    restart: unless-stopped
    labels:
      - "description=Ignition Edge HMI for VirtPLC"
      - "environment=plc"

  # Node-RED MQTT Bridge
  nodered:
    image: nodered/node-red:latest
    container_name: plc-nodered
    ports:
      - "1880:1880"   # Node-RED UI
    volumes:
      - nodered-data:/data
      - ./nodered/flows:/data/flows:ro
      - ./nodered/settings.js:/data/settings.js:ro
      - ./nodered/package.json:/data/package.json:ro
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-your-secret-key}
      - TZ=UTC
      # MQTT Configuration
      - MQTT_BROKER=${MQTT_BROKER:-mqtt}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC=unreal/factory/#
    networks:
      - plc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "description=Node-RED MQTT Bridge for VirtPLC"
      - "environment=${DEPLOYMENT_ENV:-stage2}"

  # Optional: Local MQTT Broker if not available on network
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: plc-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
    networks:
      - plc-network
    restart: unless-stopped
    profiles:
      - with-mqtt

networks:
  plc-network:
    driver: bridge
    name: plc-network

volumes:
  ignition-data:
    name: plc-ignition-data
  nodered-data:
    name: plc-nodered-data
